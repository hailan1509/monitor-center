name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/projects/monitor-center
            git fetch origin main
            git reset --hard origin/main
            docker compose build monitor-server monitor-web
            docker compose up -d monitor-server monitor-web
            # Plain "docker image prune -f" only clears dangling (untagged) images and never
            # touches build cache — a VPS disk-full incident traced back to ~15GB of unused-but-
            # tagged images + build cache accumulated across deploys. -a catches unused tagged
            # images too (safe: never removes an image referenced by any container, running or
            # stopped).
            docker image prune -a -f
            docker builder prune -f
